name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      version:
        description: "Version label, e.g. 2.0.1"
        required: true
        default: "2.0.1"

      api_base_url:
        description: "Production API base URL"
        required: false
        default: "https://api.mandalanet.id"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-android:
    name: Build & Release Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Ensure asset dirs
        run: |
          set -euo pipefail
          mkdir -p assets/images assets/icons
          touch assets/images/.gitkeep assets/icons/.gitkeep

      - name: Pub get
        run: flutter pub get

      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f android/settings.gradle.kts
          test -f android/app/build.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'create("release")' android/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts

      - name: Resolve version & API
        id: meta
        env:
          EVENT_VERSION: ${{ github.event.inputs.version }}
          EVENT_API: ${{ github.event.inputs.api_base_url }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="${EVENT_VERSION:-2.0.1}"
          fi

          API="${EVENT_API:-https://api.mandalanet.id}"
          if [ -z "$API" ]; then API="https://api.mandalanet.id"; fi

          case "$API" in
            http://*|https://*) ;;
            *)
              echo "ERROR: Invalid API URL."
              exit 1
              ;;
          esac

          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "api=$API" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"

      - name: Configure mandatory release signing
        env:
          MPORT_KEYSTORE_BASE64: ${{ secrets.MPORT_KEYSTORE_BASE64 }}
          MPORT_KEYSTORE_PASSWORD: ${{ secrets.MPORT_KEYSTORE_PASSWORD }}
          MPORT_KEY_ALIAS: ${{ secrets.MPORT_KEY_ALIAS }}
          MPORT_KEY_PASSWORD: ${{ secrets.MPORT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in MPORT_KEYSTORE_BASE64 MPORT_KEYSTORE_PASSWORD MPORT_KEY_ALIAS MPORT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: Required GitHub Secret $name is missing or empty."
              echo "Refusing to build or publish an unsigned release."
              exit 1
            fi
          done

          printf '%s' "$MPORT_KEYSTORE_BASE64" | base64 --decode > android/app/mport-release.p12
          test -s android/app/mport-release.p12

          cat > android/key.properties <<EOF2
          storePassword=$MPORT_KEYSTORE_PASSWORD
          keyPassword=$MPORT_KEY_PASSWORD
          keyAlias=$MPORT_KEY_ALIAS
          storeFile=app/mport-release.p12
          storeType=PKCS12
          EOF2
          sed -i 's/^[[:space:]]*//' android/key.properties

          chmod 600 android/key.properties android/app/mport-release.p12

          keytool -list -storetype PKCS12 \
            -keystore android/app/mport-release.p12 \
            -storepass "$MPORT_KEYSTORE_PASSWORD" \
            -alias "$MPORT_KEY_ALIAS" >/dev/null

          echo "Release keystore and alias validated."

      - name: Verify signing configuration
        run: |
          set -euo pipefail
          grep -q 'create("release")' android/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts
          test -f android/key.properties
          test -s android/app/mport-release.p12
          grep -q '^storeFile=app/mport-release.p12$' android/key.properties
          echo "Signing configuration confirmed."

      - name: Build release APK
        run: |
          set -euo pipefail
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.meta.outputs.api }}

      - name: Verify release APK signature BEFORE publishing
        id: verify_apk
        run: |
          set -euo pipefail

          APK=$(find build/app/outputs/flutter-apk -type f -name "*.apk" | head -1)
          test -n "$APK"
          test -s "$APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"
          test -x "$APKSIGNER"

          echo "APK: $APK"
          ls -lh "$APK"

          VERIFY_OUTPUT=$(mktemp)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$VERIFY_OUTPUT"

          # V1 is optional when minSdk >= 24 (AGP often omits JAR signing).
          # Require modern schemes only:
          grep -Eq 'Verified using v2 scheme \(APK Signature Scheme v2\): true' "$VERIFY_OUTPUT"
          grep -Eq 'Verified using v3 scheme \(APK Signature Scheme v3\): true' "$VERIFY_OUTPUT"
          grep -Eq 'Number of signers: [1-9]' "$VERIFY_OUTPUT"

          echo "Release APK is signed and verified (v2 + v3)."
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
      - name: Build release AAB
        run: |
          set -euo pipefail
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${{ steps.meta.outputs.api }}

      - name: Verify release AAB exists
        run: |
          set -euo pipefail
          AAB=$(find build/app/outputs/bundle/release -type f -name "*.aab" | head -1)
          test -n "$AAB"
          test -s "$AAB"
          echo "AAB: $AAB"
          ls -lh "$AAB"

      - name: Verify AAB signing
        run: |
          set -euo pipefail
          AAB=$(find build/app/outputs/bundle/release -type f -name "*.aab" | head -1)
          test -n "$AAB"
          jarsigner -verify "$AAB"
          echo "AAB signature verification PASSED."

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="${{ steps.verify_apk.outputs.apk }}"
          test -n "$APK"
          test -s "$APK"
          AAB=$(find build/app/outputs/bundle/release -type f -name "*.aab" | head -1)
          test -n "$AAB"
          test -s "$AAB"
          cp "$APK" "dist/MPorT-${{ steps.meta.outputs.version }}-release.apk"
          cp "$AAB" "dist/MPorT-${{ steps.meta.outputs.version }}-release.aab"
          ls -lh dist/

      - name: Upload verified artifacts
        uses: actions/upload-artifact@v6
        with:
          name: mport-release-${{ steps.meta.outputs.version }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: MPorT ${{ steps.meta.outputs.version }}
          generate_release_notes: true
          files: |
            dist/MPorT-${{ steps.meta.outputs.version }}-release.apk
            dist/MPorT-${{ steps.meta.outputs.version }}-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/mport-release.p12
