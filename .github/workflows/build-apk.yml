name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (dart-define)"
        required: false
        default: "https://api.mandalanet.id"
      build_mode:
        description: "debug or release"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug
  push:
    tags:
      - "v*"

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Ensure asset dirs
        run: |
          mkdir -p assets/images assets/icons
          touch assets/images/.gitkeep assets/icons/.gitkeep

      - name: Pub get
        run: flutter pub get

      - name: Verify Android project
        run: |
          set -euo pipefail
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts
          test -f android/app/src/main/AndroidManifest.xml
          grep -q 'flutterEmbedding' android/app/src/main/AndroidManifest.xml
          grep -q 'android:value="2"' android/app/src/main/AndroidManifest.xml

          if [ -f android/gradle/wrapper/gradle-wrapper.properties ]; then
            sed -i 's/gradle-[0-9.]*-all.zip/gradle-9.3.1-all.zip/' \
              android/gradle/wrapper/gradle-wrapper.properties
          fi

      - name: Resolve API URL
        id: api
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then URL="https://api.mandalanet.id"; fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Resolve build mode
        id: mode
        run: |
          MODE="${{ github.event.inputs.build_mode }}"
          if [ -z "$MODE" ]; then MODE=release; fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Configure mandatory release signing
        id: signing
        if: steps.mode.outputs.mode == 'release'
        env:
          MPORT_KEYSTORE_BASE64: ${{ secrets.MPORT_KEYSTORE_BASE64 }}
          MPORT_KEYSTORE_PASSWORD: ${{ secrets.MPORT_KEYSTORE_PASSWORD }}
          MPORT_KEY_ALIAS: ${{ secrets.MPORT_KEY_ALIAS }}
          MPORT_KEY_PASSWORD: ${{ secrets.MPORT_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          for name in MPORT_KEYSTORE_BASE64 MPORT_KEYSTORE_PASSWORD MPORT_KEY_ALIAS MPORT_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "ERROR: Required GitHub Secret $name is missing or empty."
              echo "Refusing to build/upload an unsigned release APK."
              exit 1
            fi
          done

          printf '%s' "$MPORT_KEYSTORE_BASE64" | base64 --decode > android/app/mport-release.p12
          test -s android/app/mport-release.p12

          cat > android/key.properties <<EOF2
          storePassword=$MPORT_KEYSTORE_PASSWORD
          keyPassword=$MPORT_KEY_PASSWORD
          keyAlias=$MPORT_KEY_ALIAS
          storeFile=app/mport-release.p12
          storeType=PKCS12
          EOF2

          chmod 600 android/key.properties android/app/mport-release.p12

          # Validate that the decoded file is a readable PKCS12 keystore and that
          # the configured alias exists before Gradle starts.
          keytool -list -storetype PKCS12 \
            -keystore android/app/mport-release.p12 \
            -storepass "$MPORT_KEYSTORE_PASSWORD" \
            -alias "$MPORT_KEY_ALIAS" >/dev/null

          echo "signed=true" >> "$GITHUB_OUTPUT"
          echo "Release signing material validated successfully."

      - name: Verify signing configuration
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail
          test "${{ steps.signing.outputs.signed }}" = "true"
          grep -q 'create("release")' android/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("release")' android/app/build.gradle.kts
          test -f android/key.properties
          test -s android/app/mport-release.p12

      - name: Build APK
        run: |
          set -euo pipefail
          flutter build apk --${{ steps.mode.outputs.mode }} \
            --dart-define=API_BASE_URL=${{ steps.api.outputs.url }}

      - name: Verify release APK is signed and installable
        if: steps.mode.outputs.mode == 'release'
        run: |
          set -euo pipefail

          APK=$(find build/app/outputs/flutter-apk -type f -name "*.apk" | head -1)
          test -n "$APK"
          echo "APK: $APK"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$APKSIGNER"

          VERIFY_OUTPUT=$(mktemp)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee "$VERIFY_OUTPUT"

          grep -Eq 'Verified using v2 scheme \(APK Signature Scheme v2\): true' "$VERIFY_OUTPUT"
          grep -Eq 'Verified using v3 scheme \(APK Signature Scheme v3\): true' "$VERIFY_OUTPUT"

          CERT_COUNT=$(
            "$APKSIGNER" verify --print-certs "$APK" 2>&1 \
              | grep -c "Signer #" || true
          )
          test "$CERT_COUNT" -ge 1

          echo "Release APK is signed and verified (v2 + v3)."


          # Guard against an accidentally unsigned APK even if a future tool changes
          # its human-readable output.

          echo "Release APK signature verification PASSED."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: mport-${{ steps.mode.outputs.mode }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/mport-release.p12
