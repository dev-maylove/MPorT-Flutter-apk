name: Build APK

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL (dart-define)"
        required: false
        default: "https://api.mandalanet.id"
      build_mode:
        description: "Build mode"
        required: true
        default: "release"
        type: choice
        options:
          - release
          - debug

permissions:
  contents: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.2"
          cache: true

      - name: Verify toolchain
        run: |
          set -euo pipefail
          java -version
          flutter --version
          test -f android/app/build.gradle.kts
          test -f android/settings.gradle.kts

      - name: Ensure asset directories
        run: |
          set -euo pipefail
          mkdir -p assets/images assets/icons
          touch assets/images/.gitkeep assets/icons/.gitkeep

      - name: Pub get
        run: flutter pub get

      - name: Resolve API URL
        id: api
        env:
          INPUT_API: ${{ github.event.inputs.api_base_url }}
        run: |
          set -euo pipefail

          URL="${INPUT_API:-https://api.mandalanet.id}"

          case "$URL" in
            http://*|https://*) ;;
            *)
              echo "ERROR: Invalid API URL."
              exit 1
              ;;
          esac

          printf 'url=%s\n' "$URL" >> "$GITHUB_OUTPUT"

      - name: Configure mandatory release signing
        if: github.event.inputs.build_mode == 'release'
        id: signing
        env:
          MPORT_KEYSTORE_BASE64: ${{ secrets.MPORT_KEYSTORE_BASE64 }}
          MPORT_KEYSTORE_PASSWORD: ${{ secrets.MPORT_KEYSTORE_PASSWORD }}
          MPORT_KEY_ALIAS: ${{ secrets.MPORT_KEY_ALIAS }}
          MPORT_KEY_PASSWORD: ${{ secrets.MPORT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          for name in \
            MPORT_KEYSTORE_BASE64 \
            MPORT_KEYSTORE_PASSWORD \
            MPORT_KEY_ALIAS \
            MPORT_KEY_PASSWORD
          do
            if [ -z "${!name:-}" ]; then
              echo "ERROR: GitHub Secret $name is missing or empty."
              echo "Refusing to build a release without signing."
              exit 1
            fi
          done

          test "$MPORT_KEY_ALIAS" = "mport-app" || {
            echo "ERROR: Unexpected key alias."
            exit 1
          }

          mkdir -p android/app/key

          printf '%s' "$MPORT_KEYSTORE_BASE64" \
            | base64 --decode > android/app/key/mport-app-keystore.p12

          test -s android/app/key/mport-app-keystore.p12

          printf '%s\n' \
            "storePassword=$MPORT_KEYSTORE_PASSWORD" \
            "keyPassword=$MPORT_KEY_PASSWORD" \
            "keyAlias=$MPORT_KEY_ALIAS" \
            "storeFile=app/key/mport-app-keystore.p12" \
            "storeType=PKCS12" \
            > android/key.properties

          chmod 600 android/key.properties
          chmod 600 android/app/key/mport-app-keystore.p12

          keytool -list \
            -v \
            -storetype PKCS12 \
            -keystore android/app/key/mport-app-keystore.p12 \
            -storepass "$MPORT_KEYSTORE_PASSWORD" \
            -alias "$MPORT_KEY_ALIAS" \
            >/tmp/keystore-info.txt

          grep -q "Alias name: mport-app" /tmp/keystore-info.txt
          grep -q "Entry type: PrivateKeyEntry" /tmp/keystore-info.txt

          echo "Release PKCS12 keystore validated."

      - name: Verify signing configuration
        if: github.event.inputs.build_mode == 'release'
        run: |
          set -euo pipefail

          test -f android/key.properties
          test -s android/app/key/mport-app-keystore.p12

          grep -q 'create("release")' android/app/build.gradle.kts
          grep -q 'signingConfig = signingConfigs.getByName("release")' \
            android/app/build.gradle.kts

          grep -q '^keyAlias=mport-app$' android/key.properties
          grep -q '^storeType=PKCS12$' android/key.properties
          grep -q '^storeFile=app/key/mport-app-keystore.p12$' android/key.properties

          echo "Mandatory release signing configuration confirmed."

      - name: Build APK
        env:
          BUILD_MODE: ${{ github.event.inputs.build_mode }}
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          set -euo pipefail

          flutter build apk \
            --"$BUILD_MODE" \
            --dart-define=API_BASE_URL="$API_URL"

      - name: Verify release APK
        if: github.event.inputs.build_mode == 'release'
        run: |
          set -euo pipefail

          APK="$(find build/app/outputs/flutter-apk \
            -type f -name '*.apk' -print -quit)"

          test -n "$APK"
          test -s "$APK"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" \
            -type f -name apksigner \
            | sort -V \
            | tail -1)"

          test -x "$APKSIGNER"

          echo "APK: $APK"
          echo "APK size:"
          ls -lh "$APK"

          VERIFY_OUTPUT="$(mktemp)"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" 2>&1 | tee "$VERIFY_OUTPUT"

          grep -q "Verified" "$VERIFY_OUTPUT"

          CERT_COUNT="$(
            "$APKSIGNER" verify \
              --print-certs \
              "$APK" 2>&1 \
              | grep -c "Signer #" || true
          )"

          test "$CERT_COUNT" -ge 1

          echo "Release APK signature verification PASSED."

      - name: Upload APK artifact
        uses: actions/upload-artifact@v6
        with:
          name: mport-${{ github.event.inputs.build_mode }}-apk
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          rm -f android/key.properties
          rm -f android/app/key/mport-app-keystore.p12
          rm -f /tmp/keystore-info.txt
