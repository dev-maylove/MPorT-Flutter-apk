# ── JVM / daemon ──────────────────────────────────────────────
# Heap for Gradle daemon (CI runners typically 7–16 GB).
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache: DISABLED.
# Flutter 3.47 DependencyVersionChecker (ReleaseMinSdkCheck) + AGP 9.4 Built-in Kotlin
# still capture non-serializable KotlinCompilation / DefaultLegacyConfiguration state.
# Re-enable when Flutter/AGP fix CC compatibility for builtInKotlin path.
org.gradle.configuration-cache=false
# org.gradle.configuration-cache.problems=warn
# VFS watch causes "Already watching path" on GitHub Actions runners → disable on CI.
org.gradle.vfs.watch=false
# Avoid quiet mode so CI logs stay useful; keep workers auto-tuned.
org.gradle.workers.max=8

# ── AndroidX ──────────────────────────────────────────────────
android.useAndroidX=true
# Jetifier scans every dependency; not needed for pure AndroidX Flutter apps.
android.enableJetifier=false

# ── AGP / R8 build speed ──────────────────────────────────────
# Smaller R classes → less work for compiler & R8.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# Keep new resource shrinker (faster incremental).
android.enableResourceOptimizations=true

# ── Built-in Kotlin (Flutter 3.47) ─────────────────────────────
android.builtInKotlin=true
android.newDsl=false
# Flutter DependencyVersionChecker reads this first (must be ≥ 2.2.20).
kotlin_version=2.4.10

# ── Kotlin compiler ───────────────────────────────────────────
kotlin.incremental=true
kotlin.incremental.android=true
kotlin.caching.enabled=true
kotlin.parallel.tasks.in.project=true
# Avoid dual classloader issues with configuration cache.
kotlin.jvm.target.validation.mode=warning
