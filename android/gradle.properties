org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.enableJetifier=true
# Built-in Kotlin (app module does not apply org.jetbrains.kotlin.android)
android.builtInKotlin=true
android.newDsl=false
# Flutter DependencyVersionChecker reads this first (before AGP embedded 2.2.10).
# Must be ≥ 2.2.20 for Flutter 3.47. Does not re-apply KGP on :app.
kotlin_version=2.4.10
