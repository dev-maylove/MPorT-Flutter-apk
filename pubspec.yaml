name: mport
description: "MPorT - Portal ISP MandalaNet (Flutter). Role-based user / technician / admin."
publish_to: "none"
version: 2.0.8+8

environment:
  # Flutter 3.47 / Dart 3.7+ typical; keep floor compatible with CI
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.5
  provider: ^6.1.5
  go_router: ^14.8.1
  intl: ^0.19.0
  url_launcher: ^6.3.2
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
